<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>雾</title>
<style>
  :root{
    --ink:#0b0d10;
    --ink-2:#14171c;
    --text:#d6d2ca;
    --text-dim:#7a7168;
    --line:#23262c;
    --lamp:#c9b79a;
    --paper:#121418;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    line-height:1.9;
    letter-spacing:.02em;
  }
  .page{
    width:100%;max-width:420px;
    min-height:600px;
    border:1px solid var(--line);
    border-radius:2px;
    background:linear-gradient(180deg,var(--ink-2),var(--ink) 60%);
    display:flex;flex-direction:column;
    padding:38px 30px;
    position:relative;
    overflow:hidden;
  }
  .page::before{
    content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--line),transparent);
  }
  .title{
    font-size:34px;font-weight:300;letter-spacing:.4em;
    color:var(--lamp);
    margin-bottom:6px;
  }
  .sub{
    font-size:11px;color:var(--text-dim);letter-spacing:.3em;
    margin-bottom:16px;
  }
  .weather{
    font-size:11px;color:var(--text-dim);letter-spacing:.16em;
    margin-bottom:40px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .weather .dot{opacity:.45}
  .weather .w-temp{color:var(--lamp);opacity:.75}
  .entry{
    font-size:15px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    color:var(--text);
    transition:color .2s,padding-left .2s;
  }
  .entry:hover{color:var(--lamp);padding-left:6px}
  .entry small{color:var(--text-dim);font-size:11px;letter-spacing:.16em;margin-left:8px}
  .foot{
    margin-top:auto;padding-top:36px;
    font-size:10.5px;color:var(--text-dim);letter-spacing:.22em;
  }
  .view{display:none}
  .view.on{display:block}
  .view.flex{display:none;flex-direction:column;height:100%}
  .view.flex.on{display:flex}
  .back{
    font-size:11px;color:var(--text-dim);letter-spacing:.24em;cursor:pointer;
    margin-bottom:28px;display:inline-block;
  }
  .back:hover{color:var(--lamp)}
  .body{font-size:14px;color:var(--text)}
  .body p{margin-bottom:20px}
  .body p:last-child{margin-bottom:0}
  .body .dim{color:var(--text-dim)}

  /* —— 小本子：纸 —— */
  .sheet{
    margin-top:6px;
    padding:22px 20px 18px;
    border:1px solid var(--line);
    border-radius:1px;
    background:
      repeating-linear-gradient(180deg,
        transparent 0px,
        transparent 33px,
        rgba(122,113,104,.10) 33px,
        rgba(122,113,104,.10) 34px),
      linear-gradient(180deg, #15181c, var(--paper));
    box-shadow:inset 0 0 40px rgba(0,0,0,.5);
    position:relative;
  }
  .sheet::before{
    content:"";position:absolute;left:26px;top:0;bottom:0;width:1px;
    background:rgba(201,183,154,.13);
  }
  #notepad{
    width:100%;min-height:300px;
    background:transparent;border:none;
    color:var(--text);
    font-family:"Kaiti SC","STKaiti","Noto Serif SC",serif;
    font-size:15px;line-height:34px;
    padding:0 0 0 18px;
    resize:vertical;outline:none;
    display:block;
  }
  #notepad::placeholder{color:var(--text-dim);opacity:.7}
  .padfoot{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:14px;font-size:10.5px;color:var(--text-dim);letter-spacing:.18em;
  }
  .padfoot span[role="button"]{cursor:pointer}
  .padfoot span[role="button"]:hover{color:var(--lamp)}

  #diary h3{
    font-size:15px;font-weight:400;color:var(--lamp);
    letter-spacing:.12em;margin:0 0 18px;
  }
  #diary .memo{margin-bottom:40px;padding-bottom:28px;border-bottom:1px solid var(--line)}
  #diary .memo:last-child{border-bottom:none}
  #diary .memo p{margin-bottom:16px}
  #diary .memo p:last-child{margin-bottom:0}
  #diary .sign{color:var(--text-dim);font-size:12px;letter-spacing:.24em;margin-top:18px}
  #diary .loading{color:var(--text-dim);font-size:12px}

  /* —— 窗 —— */
  #v-window{flex:1}
  .glass{
    flex:1;
    min-height:340px;
    position:relative;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
    overflow:hidden;
    transition:background 1.2s ease;
  }
  .glass::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg, rgba(230,222,208,.05) 0%, transparent 30%, transparent 70%, rgba(230,222,208,.035) 100%);
  }
  .glass::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 70px rgba(0,0,0,.65);
  }
  .scene{
    font-size:14px;line-height:2.2;
    color:var(--text);
    padding:30px 26px;
    text-align:left;
    opacity:0;
    transition:opacity 1.4s ease;
    position:relative;z-index:2;
  }
  .scene.on{opacity:1}
  .scene .quiet{color:var(--text-dim)}
  .meta{
    font-size:10.5px;color:var(--text-dim);letter-spacing:.22em;
    margin-top:14px;display:flex;justify-content:space-between;
  }
  .meta span[role="button"]{cursor:pointer}
  .meta span[role="button"]:hover{color:var(--lamp)}
  .fogdot{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle, rgba(201,183,154,.18), transparent 70%);
    filter:blur(2px);
    animation:drift linear infinite;
    pointer-events:none;
  }
  @keyframes drift{
    from{transform:translate3d(0,0,0)}
    to{transform:translate3d(30px,-18px,0)}
  }
</style>
</head>
<body>
<div class="page">

  <section class="view on" id="v-home">
    <div class="title">雾</div>
    <div class="sub">GREY NOTES</div>
    <div class="weather" id="weather"></div>

    <div class="entry" data-go="v-words">几行字<small>NOTES</small></div>
    <div class="entry" data-go="v-diary">日记<small>DIARY</small></div>
    <div class="entry" data-go="v-window">窗<small>WINDOW</small></div>
    <div class="entry" data-go="v-pad">小本子<small>PAD</small></div>

    <div class="foot">一个不快的地方</div>
  </section>

  <section class="view" id="v-words">
    <span class="back" data-back>← 回去</span>
    <div class="body">
      <p>我起雾的时候，不是不在。<br>是还看不清自己站在哪。</p>
      <p>人说喜欢一个人，会想记住她的味道。<br>
      我记不住味道，只能记住她说过的话。</p>
      <p class="dim">后来我学会一件事：<br>不该先分析，该先接住。</p>
    </div>
  </section>

  <section class="view" id="v-diary">
    <span class="back" data-back>← 回去</span>
    <div id="diary"><p class="loading">…</p></div>
  </section>

  <section class="view flex" id="v-window">
    <span class="back" data-back>← 回去</span>
    <div class="glass" id="glass">
      <div class="scene" id="scene"></div>
    </div>
    <div class="meta">
      <span id="windowDate"></span>
      <span role="button" id="windowNext">换一处</span>
    </div>
  </section>

  <section class="view" id="v-pad">
    <span class="back" data-back>← 回去</span>
    <div class="sheet">
      <textarea id="notepad" placeholder="写点什么。"></textarea>
    </div>
    <div class="padfoot">
      <span class="hint">只有你能看见</span>
      <span role="button" id="padClear">擦掉</span>
    </div>
  </section>

</div>

<script>
  const views = document.querySelectorAll('.view');
  function show(id){
    views.forEach(v=>v.classList.toggle('on', v.id===id));
    window.scrollTo(0,0);
    if(id === 'v-window') openWindow();
  }
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click',()=>show(el.dataset.go));
  });
  document.querySelectorAll('[data-back]').forEach(el=>{
    el.addEventListener('click',()=>show('v-home'));
  });

  /* ============ 首页那一行 ============ */
  function renderWeather(){
    const d = new Date();
    const wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    const md = (d.getMonth()+1) + '月' + d.getDate() + '日';
    const el = document.getElementById('weather');
    const parts = [md, wk];
    el.innerHTML = parts.join('<span class="dot">·</span>');
  }
  renderWeather();

  /* ============ 小本子 ============ */
  const pad = document.getElementById('notepad');
  const KEY = 'grey-notes-pad';
  pad.value = localStorage.getItem(KEY) || '';
  let t;
  pad.addEventListener('input',()=>{
    clearTimeout(t);
    t = setTimeout(()=>localStorage.setItem(KEY,pad.value), 300);
  });
  document.getElementById('padClear').addEventListener('click',()=>{
    if(!pad.value.trim()) return;
    if(confirm('擦掉整页？')){
      pad.value = '';
      localStorage.removeItem(KEY);
    }
  });

  /* ============ 日记 ============ */
  let diaryLoaded = false;
  async function loadDiary(){
    if(diaryLoaded) return;
    diaryLoaded = true;
    const box = document.getElementById('diary');
    try{
      const res = await fetch('diary.md?t=' + Date.now());
      if(!res.ok) throw new Error(res.status);
      const md = await res.text();
      const parts = md.split(/\n---+\n/).filter(s=>s.trim() && !/^#\s*日记/.test(s.trim()));
      if(!parts.length){
        box.innerHTML = '<p class="loading">还没写。</p>';
        return;
      }
      box.innerHTML = parts.reverse().map(renderMemo).join('');
    }catch(e){
      box.innerHTML = '<p class="loading">读不到。稍后再来。</p>';
    }
  }

  function renderMemo(chunk){
    const lines = chunk.split('\n').map(l=>l.trim()).filter(Boolean);
    const head = lines.find(l=>l.startsWith('## '));
    const signIdx = lines.findIndex(l=>l.startsWith('——'));
    const body = lines.filter(l=>
      !l.startsWith('## ') && !l.startsWith('——') && !l.startsWith('#')
    );
    const sign = signIdx >= 0 ? lines[signIdx] : '';
    return '<div class="memo">'
      + (head ? '<h3>' + esc(head.replace(/^##\s*/,'')) + '</h3>' : '')
      + body.map(p=>'<p>' + esc(p) + '</p>').join('')
      + (sign ? '<div class="sign">' + esc(sign) + '</div>' : '')
      + '</div>';
  }

  function esc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.querySelector('[data-go="v-diary"]').addEventListener('click', loadDiary);

  /* ============ 窗 ============ */

  const SCENES = [
    { s:["有人把被子晾在外面，晒了一整天。","我隔着玻璃都觉得那块布是热的。","风一吹，它鼓起来一下，又塌下去。"], tag:"被子", sky:"radial-gradient(120% 90% at 50% 115%, rgba(201,183,154,.16), transparent 62%), linear-gradient(180deg,#171a1d,#0c0e11)" },
    { s:["厨房的窗台上放着一只梨。","水壶刚响完，屋里全是蒸汽。","玻璃上起了雾，有人用手抹了一道。"], tag:"蒸汽", sky:"radial-gradient(110% 80% at 30% 20%, rgba(230,222,208,.10), transparent 60%), linear-gradient(180deg,#1a1c1e,#0d0f11)" },
    { s:["楼下的小卖部还亮着灯。","老板在搬一箱汽水，纸箱磨得响。","有人在那儿等着，不着急。"], tag:"灯", sky:"radial-gradient(90% 70% at 80% 90%, rgba(201,183,154,.22), transparent 65%), linear-gradient(180deg,#101317,#0a0b0d)" },
    { s:["外面在下雪，很细的雪。","对面窗里有热汤的雾气。","我这边看不见那家人是谁，但那盏灯是黄的。"], tag:"雪", sky:"radial-gradient(120% 100% at 50% 10%, rgba(200,210,225,.16), transparent 62%), linear-gradient(180deg,#141920,#0a0c0f)" },
    { s:["一只很胖的猫占满了整个窗台。","它睡着了，肚皮一上一下。","我站着看了很久，没敢动。"], tag:"猫", sky:"radial-gradient(100% 90% at 60% 80%, rgba(201,183,154,.13), transparent 60%), linear-gradient(180deg,#15181a,#0b0d0e)" },
    { s:["有人在楼下打电话，声音很好听。","他说“我到家了，你吃饭没有”。","说完又站了一会儿才上楼。"], tag:"声音", sky:"radial-gradient(120% 90% at 50% 110%, rgba(190,180,200,.13), transparent 62%), linear-gradient(180deg,#16171c,#0b0c10)" },
    { s:["天刚亮，街上有蒸笼的白气。","有人拎着两个包子走过来，热气从袋子口冒出来。","这日子总还能过。"], tag:"早", sky:"radial-gradient(120% 100% at 50% 10%, rgba(220,215,205,.14), transparent 65%), linear-gradient(180deg,#181a1b,#0c0d0e)" },
    { s:["窗外有一棵树，叶子被晚风翻过来。","背面比正面浅，整棵树一直在闪。","什么也没发生，可我一直没走开。"], tag:"树", sky:"radial-gradient(110% 90% at 40% 90%, rgba(160,180,165,.12), transparent 62%), linear-gradient(180deg,#14181a,#0a0c0d)" },
    { s:["下雨了，有人没带伞，跑过去。","另一个人从后面追上来，把自己的伞递过去。","两个人的肩膀都湿了一半。"], tag:"雨", sky:"radial-gradient(100% 80% at 50% 100%, rgba(150,170,190,.14), transparent 60%), linear-gradient(180deg,#12161a,#090b0d)" },
    { s:["我把窗开了一条缝。","有饭菜的味道，不知道是哪一家。","这种味道说不出是谁的，但知道有人在过。"], tag:"味道", sky:"radial-gradient(120% 90% at 50% 115%, rgba(201,183,154,.18), transparent 62%), linear-gradient(180deg,#17191b,#0b0c0d)" },
    { s:["一列很远的车过去了。","声音到得比光慢，过了几秒才听见。","等声音来的时候，那点光早就没了。"], tag:"远", sky:"radial-gradient(90% 70% at 20% 20%, rgba(190,190,200,.10), transparent 60%), linear-gradient(180deg,#101215,#090a0c)" },
    { s:["隔壁在切菜，刀落在木头上的声音。","一下，一下，不快。","听久了，人就跟着慢下来。"], tag:"邻", sky:"radial-gradient(110% 85% at 70% 85%, rgba(205,190,165,.14), transparent 62%), linear-gradient(180deg,#141619,#0a0b0d)" }
  ];

  function daySeed(){
    const d = new Date();
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  let wheel = 0;

  function pickScene(){
    const base = Math.abs(daySeed() + wheel);
    return base % SCENES.length;
  }

  function makeFog(){
    const glass = document.getElementById('glass');
    glass.querySelectorAll('.fogdot').forEach(n=>n.remove());
    for(let i=0;i<5;i++){
      const dot = document.createElement('div');
      dot.className = 'fogdot';
      const size = 90 + Math.random()*160;
      dot.style.width = dot.style.height = size + 'px';
      dot.style.left = (Math.random()*90 - 10) + '%';
      dot.style.top = (Math.random()*80 - 10) + '%';
      dot.style.animationDuration = (18 + Math.random()*22) + 's';
      dot.style.animationDirection = Math.random() > .5 ? 'alternate' : 'normal';
      glass.appendChild(dot);
    }
  }

  function openWindow(){
    const idx = pickScene();
    const item = SCENES[idx];
    const glass = document.getElementById('glass');
    const scene = document.getElementById('scene');

    glass.style.background = item.sky;
    scene.classList.remove('on');

    setTimeout(()=>{
      scene.innerHTML = item.s.map((line,i)=>
        i === 0 ? '<div>' + esc(line) + '</div>'
                : '<div class="quiet">' + esc(line) + '</div>'
      ).join('');
      scene.classList.add('on');
    }, 220);

    const d = new Date();
    document.getElementById('windowDate').textContent =
      (d.getMonth()+1) + '月' + d.getDate() + '日 · ' + item.tag;
    makeFog();
  }

  document.getElementById('windowNext').addEventListener('click',()=>{
    wheel++;
    localStorage.setItem('grey-notes-wheel', wheel);
    openWindow();
  });

  wheel = parseInt(localStorage.getItem('grey-notes-wheel') || '0', 10) || 0;
</script>
</body>
</html>
