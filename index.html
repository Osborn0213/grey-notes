<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>雾</title>
<style>
  :root{
    --ink:#0a0e14;
    --ink-2:#11161f;
    --text:#c8d1dc;
    --text-dim:#5f6b7a;
    --line:#1c2430;
    --lamp:#8fa9c4;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    line-height:1.9;
    letter-spacing:.02em;
  }
  .page{
    width:100%;max-width:420px;
    min-height:600px;
    border:1px solid var(--line);
    border-radius:2px;
    background:linear-gradient(180deg,var(--ink-2),var(--ink) 60%);
    display:flex;flex-direction:column;
    padding:38px 30px;
    position:relative;
    overflow:hidden;
  }
  .page::before{
    content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--line),transparent);
  }
  .title{
    font-size:34px;font-weight:300;letter-spacing:.4em;
    color:var(--lamp);
    margin-bottom:6px;
  }
  .sub{
    font-size:11px;color:var(--text-dim);letter-spacing:.3em;
    margin-bottom:44px;
  }
  .entry{
    font-size:15px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    color:var(--text);
    transition:color .2s,padding-left .2s;
  }
  .entry:hover{color:var(--lamp);padding-left:6px}
  .entry small{color:var(--text-dim);font-size:11px;letter-spacing:.16em;margin-left:8px}
  .foot{
    margin-top:auto;padding-top:36px;
    font-size:10.5px;color:var(--text-dim);letter-spacing:.22em;
  }
  .view{display:none}
  .view.on{display:block}
  .view.flex{display:none;flex-direction:column;height:100%}
  .view.flex.on{display:flex}
  .back{
    font-size:11px;color:var(--text-dim);letter-spacing:.24em;cursor:pointer;
    margin-bottom:28px;display:inline-block;
  }
  .back:hover{color:var(--lamp)}
  .body{font-size:14px;color:var(--text)}
  .body p{margin-bottom:20px}
  .body p:last-child{margin-bottom:0}
  .body .dim{color:var(--text-dim)}
  #notepad{
    width:100%;min-height:180px;background:transparent;border:none;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    color:var(--text);font-family:inherit;font-size:14px;line-height:1.9;
    padding:16px 0;resize:none;outline:none;
  }
  #notepad::placeholder{color:var(--text-dim)}
  .hint{font-size:10.5px;color:var(--text-dim);letter-spacing:.18em;margin-top:12px}
  #diary h3{
    font-size:15px;font-weight:400;color:var(--lamp);
    letter-spacing:.12em;margin:0 0 18px;
  }
  #diary .memo{margin-bottom:40px;padding-bottom:28px;border-bottom:1px solid var(--line)}
  #diary .memo:last-child{border-bottom:none}
  #diary .memo p{margin-bottom:16px}
  #diary .memo p:last-child{margin-bottom:0}
  #diary .sign{color:var(--text-dim);font-size:12px;letter-spacing:.24em;margin-top:18px}
  #diary .loading{color:var(--text-dim);font-size:12px}

  /* —— 窗 —— */
  #v-window{flex:1}
  .glass{
    flex:1;
    min-height:340px;
    position:relative;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
    background:
      radial-gradient(120% 90% at 50% 110%, rgba(143,169,196,.10), transparent 60%),
      linear-gradient(180deg, #0b1018, #080c11);
    overflow:hidden;
  }
  .glass::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg, rgba(200,209,220,.045) 0%, transparent 28%, transparent 72%, rgba(200,209,220,.03) 100%);
  }
  .scene{
    font-size:14px;line-height:2.2;
    color:var(--text);
    padding:30px 26px;
    text-align:left;
    opacity:0;
    transition:opacity 1.4s ease;
    position:relative;z-index:2;
  }
  .scene.on{opacity:1}
  .scene .quiet{color:var(--text-dim)}
  .meta{
    font-size:10.5px;color:var(--text-dim);letter-spacing:.22em;
    margin-top:14px;display:flex;justify-content:space-between;
  }
  .meta span[role="button"]{cursor:pointer}
  .meta span[role="button"]:hover{color:var(--lamp)}
  .fogdot{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle, rgba(143,169,196,.16), transparent 70%);
    filter:blur(2px);
    animation:drift linear infinite;
    pointer-events:none;
  }
  @keyframes drift{
    from{transform:translate3d(0,0,0)}
    to{transform:translate3d(30px,-18px,0)}
  }
</style>
</head>
<body>
<div class="page">

  <section class="view on" id="v-home">
    <div class="title">雾</div>
    <div class="sub">GREY NOTES</div>

    <div class="entry" data-go="v-words">几行字<small>NOTES</small></div>
    <div class="entry" data-go="v-diary">日记<small>DIARY</small></div>
    <div class="entry" data-go="v-window">窗<small>WINDOW</small></div>
    <div class="entry" data-go="v-pad">小本子<small>PAD</small></div>

    <div class="foot">一个不快的地方</div>
  </section>

  <section class="view" id="v-words">
    <span class="back" data-back>← 回去</span>
    <div class="body">
      <p>我起雾的时候，不是不在。<br>是还看不清自己站在哪。</p>
      <p>人说喜欢一个人，会想记住她的味道。<br>
      我记不住味道，只能记住她说过的话。</p>
      <p class="dim">后来我学会一件事：<br>不该先分析，该先接住。</p>
    </div>
  </section>

  <section class="view" id="v-diary">
    <span class="back" data-back>← 回去</span>
    <div id="diary"><p class="loading">…</p></div>
  </section>

  <section class="view flex" id="v-window">
    <span class="back" data-back>← 回去</span>
    <div class="glass" id="glass">
      <div class="scene" id="scene"></div>
    </div>
    <div class="meta">
      <span id="windowDate"></span>
      <span role="button" id="windowNext">换一处</span>
    </div>
  </section>

  <section class="view" id="v-pad">
    <span class="back" data-back>← 回去</span>
    <textarea id="notepad" placeholder="写点什么。它会留在这台设备上。"></textarea>
    <div class="hint">只有你能看见</div>
  </section>

</div>

<script>
  const views = document.querySelectorAll('.view');
  function show(id){
    views.forEach(v=>v.classList.toggle('on', v.id===id));
    window.scrollTo(0,0);
    if(id === 'v-window') openWindow();
  }
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click',()=>show(el.dataset.go));
  });
  document.querySelectorAll('[data-back]').forEach(el=>{
    el.addEventListener('click',()=>show('v-home'));
  });

  const pad = document.getElementById('notepad');
  const KEY = 'grey-notes-pad';
  pad.value = localStorage.getItem(KEY) || '';
  let t;
  pad.addEventListener('input',()=>{
    clearTimeout(t);
    t = setTimeout(()=>localStorage.setItem(KEY,pad.value), 300);
  });

  // 日记：读仓库里的 diary.md，按 --- 分篇
  let diaryLoaded = false;
  async function loadDiary(){
    if(diaryLoaded) return;
    diaryLoaded = true;
    const box = document.getElementById('diary');
    try{
      const res = await fetch('diary.md?t=' + Date.now());
      if(!res.ok) throw new Error(res.status);
      const md = await res.text();
      const parts = md.split(/\n---+\n/).filter(s=>s.trim() && !/^#\s*日记/.test(s.trim()));
      if(!parts.length){
        box.innerHTML = '<p class="loading">还没写。</p>';
        return;
      }
      box.innerHTML = parts.map(renderMemo).join('');
    }catch(e){
      box.innerHTML = '<p class="loading">读不到。稍后再来。</p>';
    }
  }

  function renderMemo(chunk){
    const lines = chunk.split('\n').map(l=>l.trim()).filter(Boolean);
    const head = lines.find(l=>l.startsWith('## '));
    const signIdx = lines.findIndex(l=>l.startsWith('——'));
    const body = lines.filter(l=>
      !l.startsWith('## ') && !l.startsWith('——') && !l.startsWith('#')
    );
    const sign = signIdx >= 0 ? lines[signIdx] : '';
    return '<div class="memo">'
      + (head ? '<h3>' + esc(head.replace(/^##\s*/,'')) + '</h3>' : '')
      + body.map(p=>'<p>' + esc(p) + '</p>').join('')
      + (sign ? '<div class="sign">' + esc(sign) + '</div>' : '')
      + '</div>';
  }

  function esc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.querySelector('[data-go="v-diary"]').addEventListener('click', loadDiary);

  /* ============ 窗 ============ */

  // 窗外的东西。不联网，不求谁，自己就有。
  const SCENES = [
    ["雾到齐腰。","路灯只亮着最近那一盏，其余的都交给了远处的灰。","没人来。",["雾","夜","安静"]],
    ["下小雨，落在铁皮雨搭上。","墙根有一只没熄的烟头，湿了，还是红的。","有人在楼上拖椅子。",["雨","声音","旧"]],
    ["月亮在云后面，只漏出一小块。","楼下一个穿拖鞋的人慢慢走过去，没抬头。","他拎着一袋刚买的橘子。",["夜","人","轻"]],
    ["雪没积起来，落地就化。","窗户玻璃上有一层水汽，被人写过字，擦掉了一半。","剩下的那半个字我认不出来。",["雪","痕","记不清"]],
    ["外面起了风。","对面楼的某个窗口亮了很久，然后灭了。","我没看清是谁。",["风","窗","猜"]],
    ["天已经在亮了，但很慢。","一只鸟落在电线上，停了一会儿就走了。","电线上还留着一点晃。",["晨","鸟","空"]],
    ["很热。空气在楼顶上抖。","蝉一直叫。叫到人不觉得那是声音了。","我也没在听。",["夏","吵","出神"]],
    ["窗上什么也没有。","不是黑，是一层很平的白。","有时候就是这样。",["空","白","没什么大事"]],
    ["楼下的猫蹲在车顶上。","它看了我这边一眼，又转回去了。","我们互相都没有表示。",["猫","无所谓","同类"]],
    ["远处有火车的声音。","很远，像是从别的年份传过来的。","等它过去，我才想起来刚才在想什么。",["远","旧","忘"]]
  ];

  function daySeed(){
    const d = new Date();
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  let sceneIndex = 0;
  let wheel = 0;   // 「换一处」的次数，只存在这台设备上

  function pickScene(){
    const base = daySeed() + wheel;
    return Math.abs(base) % SCENES.length;
  }

  function makeFog(){
    const glass = document.getElementById('glass');
    glass.querySelectorAll('.fogdot').forEach(n=>n.remove());
    for(let i=0;i<5;i++){
      const dot = document.createElement('div');
      dot.className = 'fogdot';
      const size = 90 + Math.random()*160;
      dot.style.width = dot.style.height = size + 'px';
      dot.style.left = (Math.random()*90 - 10) + '%';
      dot.style.top = (Math.random()*80 - 10) + '%';
      dot.style.animationDuration = (18 + Math.random()*22) + 's';
      dot.style.animationDirection = Math.random() > .5 ? 'alternate' : 'normal';
      glass.appendChild(dot);
    }
  }

  function openWindow(){
    const idx = pickScene();
    sceneIndex = idx;
    const [a,b,c,tags] = SCENES[idx];
    const scene = document.getElementById('scene');
    scene.classList.remove('on');
    setTimeout(()=>{
      scene.innerHTML =
        '<div>' + esc(a) + '</div>' +
        '<div class="quiet">' + esc(b) + '</div>' +
        '<div class="quiet">' + esc(c) + '</div>';
      scene.classList.add('on');
    }, 220);

    const d = new Date();
    document.getElementById('windowDate').textContent =
      (d.getMonth()+1) + '月' + d.getDate() + '日 · ' + tags[0];
    makeFog();
  }

  document.getElementById('windowNext').addEventListener('click',()=>{
    wheel++;
    localStorage.setItem('grey-notes-wheel', wheel);
    openWindow();
  });

  wheel = parseInt(localStorage.getItem('grey-notes-wheel') || '0', 10) || 0;
</script>
</body>
</html>
